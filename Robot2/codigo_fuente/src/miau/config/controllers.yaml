controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controlador que usa el nodo de trayectorias (comandos de VELOCIDAD [rad/s])
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # Se deja declarado por si quieres volver a posición, pero NO se lanza (ver gazebo.launch.py)
    position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3

velocity_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
    interface_name: velocity

position_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
    interface_name: position
